# Every push and pull request: lint, format, tests and a build. Pushes to main also deploy the build to
# GitHub Pages. The backend URL comes from the repository variable VITE_API_URL; it is public by design
# (it ends up in the browser code anyway). API keys never pass through here: they live in Cloudflare.
name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A deploy that has started is allowed to finish; a newer push to a pull request replaces the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        # The live site must talk to the live Worker: no build with a missing or local address gets deployed.
        run: |
          case "$VITE_API_URL" in
            https://*) ;;
            *)
              echo "::error::Set the repository variable VITE_API_URL to the live https:// address of the Worker."
              exit 1
              ;;
          esac
          npm run build
          if grep -rq "localhost" dist; then
            echo "::error::The production build mentions localhost."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
